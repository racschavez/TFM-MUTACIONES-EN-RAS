        secondary:
          id: 5UK9
          ligand: GppNHp
          resolution_angstrom: 1.89
    HRAS:
      uniprot_id: P01112
      length: 189
      domain_g:
        start: 1
        end: 166
      pdbs:
        primary:
          id: 3K8Y
          ligand: GppNHp
          resolution_angstrom: 1.30
        secondary:
          id: 2RGE
          ligand: GDP
