[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-ras"
version = "0.1.0"
description = "Pipeline para análisis comparativo de mutaciones somáticas en la familia RAS"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "[Nombre del alumno]"}]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
